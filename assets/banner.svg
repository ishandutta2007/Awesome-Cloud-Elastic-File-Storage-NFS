<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes float-slow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes wave-flow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .bg-pulse {
      animation: pulse 6s ease-in-out infinite;
      transform-origin: center;
    }

    .floating-card {
      animation: float-slow 4s ease-in-out infinite;
    }

    .data-stream {
      stroke-dasharray: 8 12;
      animation: wave-flow 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="16" />

  <!-- Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Background Dynamic Glowing Orbs -->
  <g class="bg-pulse">
    <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
    <circle cx="1000" cy="300" r="160" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" />
  </g>

  <!-- Data Flow Lines (Dynamic Background Element) -->
  <path class="data-stream" d="M 50 320 Q 300 260 600 330 T 1150 280" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path class="data-stream" d="M 50 340 Q 350 390 700 310 T 1150 350" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" />

  <!-- Accent Line at top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-gradient)" rx="3" />

  <!-- Central Foreground Container -->
  <g transform="translate(60, 60)">
    <!-- Icon & Title Row -->
    <g transform="translate(0, 40)">
      <!-- Cloud Storage Icon -->
      <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#accent-gradient)" />
      <path d="M 20 42 C 16 42 13 39 13 35 C 13 31.5 15.5 28.5 19 28 C 20.5 23 25 19 30 19 C 35.5 19 40 23 41 28.5 C 44.5 29 47 32 47 35.5 C 47 39 44 42 40 42 Z" fill="#ffffff" transform="translate(4, 3)" />
      
      <text x="84" y="45" class="title">Awesome Cloud Elastic File Storage NFS 🗂️</text>
    </g>

    <!-- Subtitle -->
    <text x="84" y="130" class="subtitle">Curated Directory of Cloud Managed NFS, Scale-Out NAS &amp; Distributed File Systems</text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(84, 160)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="36" rx="18" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#38bdf8" />
        <text x="32" y="23" class="badge-text">Amazon EFS</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(152, 0)">
        <rect width="180" height="36" rx="18" fill="url(#card-grad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#818cf8" />
        <text x="32" y="23" class="badge-text">Google Cloud Filestore</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(344, 0)">
        <rect width="130" height="36" rx="18" fill="url(#card-grad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#c084fc" />
        <text x="32" y="23" class="badge-text">Azure Files</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(486, 0)">
        <rect width="110" height="36" rx="18" fill="url(#card-grad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#34d399" />
        <text x="32" y="23" class="badge-text">CephFS</text>
      </g>

      <!-- Pill 5 -->
      <g transform="translate(608, 0)">
        <rect width="120" height="36" rx="18" fill="url(#card-grad)" stroke="rgba(251, 146, 60, 0.4)" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#fb923c" />
        <text x="32" y="23" class="badge-text">GlusterFS</text>
      </g>

      <!-- Pill 6 -->
      <g transform="translate(740, 0)">
        <rect width="140" height="36" rx="18" fill="url(#card-grad)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#f43f5e" />
        <text x="32" y="23" class="badge-text">NFS-Ganesha</text>
      </g>
    </g>
  </g>
</svg>
